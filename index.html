<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="خدماتي - منصة خدمات">
  <title>خدماتي - V1.3</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="#" aria-label="خدماتي">
      <span class="brand-icon">⚡</span>
      <span>خدماتي</span>
    </a>
    <button id="languageBtn" class="language-btn" type="button">English</button>
  </header>

  <main class="page">
    <section class="login-card" aria-labelledby="loginTitle">
      <h1 id="loginTitle">تسجيل الدخول</h1>
      <p class="subtitle">مرحباً بعودتك، سجل الدخول للمتابعة</p>

      <form id="loginForm" novalidate>
        <label for="phone">رقم الهاتف</label>
        <div class="phone-wrap">
          <span class="country">🇪🇬 <b>+20</b></span>
          <input id="phone" name="phone" type="tel"
                 inputmode="numeric" autocomplete="tel"
                 placeholder="01xxxxxxxxx" maxlength="11">
        </div>

        <label for="password">كلمة السر</label>
        <div class="password-wrap">
          <input id="password" name="password" type="password"
                 autocomplete="current-password" placeholder="كلمة السر">
          <button id="togglePassword" class="eye-btn" type="button"
                  aria-label="إظهار كلمة السر">◉</button>
        </div>

        <div class="forgot-row">
          <a href="#" id="forgotLink">نسيت كلمة السر؟</a>
        </div>

        <button class="primary-btn" type="submit">تسجيل الدخول</button>
      </form>

      <div class="divider"><span>أو</span></div>

      <button id="googleBtn" class="google-btn" type="button">
        <span class="google-g">G</span>
        <span>تسجيل الدخول بواسطة جوجل</span>
      </button>

      <p class="signup">لست مشترك؟ <a href="#" id="signupLink">أنشئ حساب</a></p>

      <a class="help" href="#" id="helpLink">تحتاج إلى المساعدة؟</a>
    </section>
  </main>

  <footer>خدماتي • V1.3</footer>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>

  <script src="app.js"></script>
</body>
</html>
