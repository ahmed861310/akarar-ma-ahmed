<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>خدماتي ⚡ V1.5</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
<header class="topbar">
  <div class="brand">خدماتي <span>⚡</span></div>
  <button id="logoutTop" class="ghost hidden">تسجيل خروج</button>
</header>

<main>
  <section id="loginPage" class="page">
    <div class="login-card">
      <div class="logo-circle">⚡</div>
      <h1>تسجيل الدخول</h1>
      <p class="muted">سجّل دخولك للوصول إلى خدماتك</p>

      <label>رقم الهاتف</label>
      <input id="phone" inputmode="numeric" maxlength="11" placeholder="01xxxxxxxxx">

      <label>كلمة السر</label>
      <input id="password" type="password" placeholder="كلمة السر">

      <button id="loginBtn" class="primary">تسجيل الدخول</button>
      <button id="demoBtn" class="secondary">تجربة سريعة</button>
      <p id="loginMsg" class="msg"></p>
    </div>
  </section>

  <section id="homePage" class="page hidden">
    <div class="welcome">
      <div>
        <span class="muted">مرحباً بعودتك 👋</span>
        <h1 id="welcomeName">مستخدم خدماتي</h1>
        <p>كل خدماتك في مكان واحد.</p>
      </div>
      <div class="avatar">👤</div>
    </div>

    <div class="stats">
      <div class="stat"><strong id="requestsCount">0</strong><span>طلبات</span></div>
      <div class="stat"><strong id="notificationsCount">2</strong><span>إشعارات</span></div>
      <div class="stat"><strong>متاح</strong><span>الحساب</span></div>
    </div>

    <h2>الخدمات</h2>
    <div class="services">
      <button class="service" data-title="الطلبات">
        <span>📋</span><b>الطلبات</b><small>إنشاء ومتابعة الطلبات</small>
      </button>
      <button class="service" data-title="المدفوعات">
        <span>💳</span><b>المدفوعات</b><small>متابعة المدفوعات والفواتير</small>
      </button>
      <button class="service" data-title="متابعة الطلب">
        <span>🔎</span><b>متابعة الطلب</b><small>اعرف آخر حالة لطلبك</small>
      </button>
      <button class="service" data-title="الشكاوى">
        <span>📝</span><b>الشكاوى</b><small>أرسل شكوى وتابع الرد</small>
      </button>
      <button class="service" data-title="الإشعارات">
        <span>🔔</span><b>الإشعارات</b><small>آخر التنبيهات والتحديثات</small>
      </button>
      <button class="service" data-title="حسابي">
        <span>👤</span><b>حسابي</b><small>بيانات الحساب والإعدادات</small>
      </button>
    </div>

    <div class="panel">
      <h2>آخر التحديثات</h2>
      <div class="notice"><span>🔔</span><div><b>مرحباً بك في خدماتي</b><p>تم تجهيز لوحة الخدمات الجديدة.</p></div></div>
      <div class="notice"><span>✅</span><div><b>الحساب جاهز</b><p>يمكنك تجربة الخدمات من لوحة التحكم.</p></div></div>
    </div>
  </section>
</main>

<div id="toast" class="toast"></div>
<script src="app.js"></script>
</body>
</html>
