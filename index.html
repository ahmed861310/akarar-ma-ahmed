<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
  <meta name="theme-color" content="#1737ff">
  <title>خدماتي - V1.2</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <div class="brand"><span class="bolt">⚡</span><span>خدماتي</span></div>
      <button id="langBtn" class="lang-btn" type="button">English</button>
    </header>

    <section id="loginView" class="view">
      <div class="hero">
        <h1>تسجيل الدخول</h1>
        <p>مرحباً بعودتك، سجل الدخول للمتابعة</p>
      </div>

      <form id="loginForm" class="form" novalidate>
        <div class="field phone-field">
          <span class="country">🇪🇬 +20</span>
          <input id="loginPhone" type="tel" inputmode="numeric" maxlength="11" placeholder="رقم الهاتف" autocomplete="tel">
        </div>

        <div class="field">
          <input id="loginPassword" type="password" placeholder="كلمة السر" autocomplete="current-password">
          <button class="eye" type="button" data-target="loginPassword" aria-label="إظهار كلمة السر">◉</button>
        </div>

        <button id="forgotBtn" class="link-btn forgot" type="button">نسيت كلمة السر؟</button>
        <button class="primary" type="submit">تسجيل الدخول</button>
      </form>

      <div class="or"><span></span><b>أو</b><span></span></div>
      <button id="googleBtn" class="google" type="button"><strong>G</strong> تسجيل الدخول بواسطة جوجل</button>

      <p class="switch">لست مشترك؟ <button id="showRegister" class="link-btn" type="button">أنشئ حساب</button></p>
      <button id="helpBtn" class="help link-btn" type="button">تحتاج إلى المساعدة؟</button>
      <div id="loginMsg" class="message"></div>
    </section>

    <section id="registerView" class="view hidden">
      <div class="hero">
        <h1>إنشاء حساب</h1>
        <p>أنشئ حسابك وابدأ استخدام خدماتي</p>
      </div>

      <form id="registerForm" class="form" novalidate>
        <div class="field"><input id="registerName" type="text" placeholder="الاسم بالكامل" autocomplete="name"></div>
        <div class="field phone-field"><span class="country">🇪🇬 +20</span><input id="registerPhone" type="tel" inputmode="numeric" maxlength="11" placeholder="رقم الهاتف" autocomplete="tel"></div>
        <div class="field"><input id="registerPassword" type="password" placeholder="كلمة السر" autocomplete="new-password"><button class="eye" type="button" data-target="registerPassword">◉</button></div>
        <div class="field"><input id="registerConfirm" type="password" placeholder="تأكيد كلمة السر" autocomplete="new-password"><button class="eye" type="button" data-target="registerConfirm">◉</button></div>
        <button class="primary" type="submit">إنشاء الحساب</button>
      </form>

      <p class="switch">لديك حساب بالفعل؟ <button id="showLogin" class="link-btn" type="button">تسجيل الدخول</button></p>
      <div id="registerMsg" class="message"></div>
    </section>

    <section id="homeView" class="view hidden">
      <div class="home-card">
        <div class="avatar">م</div>
        <div>
          <p class="small">مرحباً بك 👋</p>
          <h1 id="userName">مستخدم خدماتي</h1>
        </div>
      </div>

      <h2>خدماتك</h2>
      <div class="services">
        <button class="service" type="button"><span>🛠️</span><b>الخدمات</b><small>استكشف الخدمات</small></button>
        <button class="service" type="button"><span>📋</span><b>طلباتي</b><small>تابع طلباتك</small></button>
        <button class="service" type="button"><span>👤</span><b>حسابي</b><small>بيانات الحساب</small></button>
        <button class="service" type="button"><span>💬</span><b>المساعدة</b><small>تواصل معنا</small></button>
      </div>

      <button id="logoutBtn" class="logout" type="button">تسجيل الخروج</button>
      <p class="version">خدماتي V1.2</p>
    </section>
  </main>

  <div id="toast" class="toast"></div>
  <script src="app.js"></script>
</body>
</html>
