<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2038f5"><title>خدماتي - V1.1</title><link rel="stylesheet" href="style.css"></head><body><main class="app">
<section id="loginPage" class="page active"><div class="topbar"><button class="lang" id="langBtn">English</button><div class="brand">خدماتي <b>⚡</b></div></div><div class="auth-wrap"><h1>تسجيل الدخول</h1><form id="loginForm" class="form"><label class="field phone"><span>🇪🇬 +20⌄</span><input id="loginPhone" type="tel" inputmode="numeric" placeholder="رقم الهاتف" required></label><label class="field"><input id="loginPassword" type="password" placeholder="كلمة السر" required><button type="button" class="eye" data-target="loginPassword">◉</button></label><button type="button" class="link" id="forgotBtn">نسيت كلمة السر؟</button><button class="primary">تسجيل الدخول</button></form><div class="divider"><span>أو</span></div><button class="google" id="googleBtn"><b>G</b> تسجيل الدخول بواسطة جوجل</button><p class="switch"><span>لست مشترك؟</span><button id="showRegister">أنشئ حساب</button></p></div><button class="help" id="helpBtn">تحتاج إلى المساعدة؟</button></section>
<section id="registerPage" class="page"><div class="topbar"><button class="back" data-back>→</button><div class="brand">خدماتي <b>⚡</b></div></div><div class="auth-wrap"><h1>إنشاء حساب</h1><p class="subtitle">أنشئ حسابك للوصول إلى خدماتك بسهولة</p><form id="registerForm" class="form"><label class="field"><input id="regName" placeholder="الاسم بالكامل" required></label><label class="field"><input id="regPhone" type="tel" inputmode="numeric" placeholder="رقم الهاتف" required></label><label class="field"><input id="regPassword" type="password" minlength="6" placeholder="كلمة السر" required></label><label class="field"><input id="regPassword2" type="password" minlength="6" placeholder="تأكيد كلمة السر" required></label><button class="primary">إنشاء الحساب</button></form><p class="switch"><span>لديك حساب بالفعل؟</span><button data-back>تسجيل الدخول</button></p></div></section>
<section id="homePage" class="page"><header><div><p>أهلاً بك 👋</p><h1 id="userName">مستخدم خدماتي</h1></div><button class="avatar" id="profileBtn">👤</button></header><div class="search">⌕ <input id="search" placeholder="ابحث عن خدمة..."></div><div class="hero"><div><span>خدماتك في مكان واحد</span><h2>أنجز خدماتك بسهولة</h2><p>اختار الخدمة وابدأ طلبك الآن.</p></div><strong>⚡</strong></div><div class="section"><h2>الخدمات</h2><button id="allServices">عرض الكل</button></div><div class="services"><button class="service" data-service="خدمات المستندات">📄<b>المستندات</b><small>طلبات ومستندات</small></button><button class="service" data-service="الخدمات الحكومية">🏛️<b>خدمات حكومية</b><small>خدمات إلكترونية</small></button><button class="service" data-service="المدفوعات">💳<b>المدفوعات</b><small>دفع ومتابعة</small></button><button class="service" data-service="طلبات الدعم">🛟<b>الدعم</b><small>ساعدنا نساعدك</small></button></div><div class="section"><h2>طلباتك الأخيرة</h2><button id="ordersBtn">كل الطلبات</button></div><div class="empty">📋<b>لا توجد طلبات حتى الآن</b><span>ابدأ باستخدام إحدى الخدمات</span></div><nav><button class="active">⌂<small>الرئيسية</small></button><button id="myOrders">▣<small>طلباتي</small></button><button id="profileNav">●<small>حسابي</small></button></nav></section></main><div id="toast"></div><script src="app.js"></script></body></html>
